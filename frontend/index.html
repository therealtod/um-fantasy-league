<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UM Fantasy League</title>
    <meta
      name="description"
      content="Fantasy league for real Unmatched tournaments: draft heroes under a budget and follow live standings."
    />
    <!-- Dark by design (see main.css); tells mobile browsers to tint their
         chrome to the app surface rather than flashing white. -->
    <meta name="theme-color" content="#131313" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Link unfurls: the league lives in Discord, so a pasted URL should
         render as something other than a bare hostname. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="UM Fantasy League" />
    <meta
      property="og:description"
      content="Fantasy league for real Unmatched tournaments: draft heroes under a budget and follow live standings."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anybody:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
