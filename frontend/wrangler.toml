name = "um-fantasy-league"
main = "src/worker.ts"
compatibility_date = "2026-08-03"

# Belt-and-braces against a dashboard-only var (there is none right now --
# BACKEND_HOST moved into [vars] below once its hostname became stable, see
# that entry's comment) getting silently wiped by a future deploy. Harmless
# to leave on even with nothing dashboard-only left to protect.
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
# The backend's base URL (see env.BACKEND_HOST in src/worker.ts). Safe to
# commit: it's a named Cloudflare Tunnel hostname (docker-compose.prod.yml's
# `cloudflared` service, see AGENTS.md's CI/CD section), not the old ad-hoc
# quick tunnel whose trycloudflare.com address rotated on every restart and
# so had to live only in the Worker dashboard. Keep this in step with
# VITE_API_PROXY_TARGET / the `server.proxy` target in vite.config.ts (see
# AGENTS.md's Commands section) so dev and prod hit the same API.
BACKEND_HOST = "https://api.umfantasyleague.com"
