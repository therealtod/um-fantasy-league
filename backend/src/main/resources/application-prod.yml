spring:
  datasource:
    # Supabase Postgres. Use the direct connection or Session pooler (port 5432) —
    # not the Transaction-mode pooler (port 6543), which breaks the JDBC driver's
    # prepared-statement caching that Spring Data JDBC/JdbcClient rely on. Append
    # ?sslmode=require. Default database name is "postgres", not "umfl".
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
          # Only set if the Supabase project uses modern JWKS signing keys
          # (Project Settings -> API -> JWT Keys). Legacy HS256-secret projects
          # should remove this and use the jwtDecoder bean in SecurityConfig
          # driven by SUPABASE_JWT_SECRET instead.
          jwk-set-uri: ${SUPABASE_JWKS_URI}

app:
  # Only needed if a frontend deployment calls the API cross-origin instead of
  # through the same-origin `_redirects` proxy (UMFL-01) — see ProdCorsConfig.
  frontend-origin: ${FRONTEND_ORIGIN:}

logging:
  level:
    com.umfl: INFO
