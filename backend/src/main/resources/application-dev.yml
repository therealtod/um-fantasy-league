spring:
  flyway:
    # Base `application.yml` points Flyway at `db/migration` only --
    # the schema plus the canonical hero and board catalogue, which every
    # profile needs. `db/seed` layers demo fixtures on top -- three
    # tournaments, seeded managers (NeonStrategist et al.), a full recorded
    # result set -- so local dev has something to click through. See
    # `V1__core_schema.sql`'s header for the three-way split.
    locations: filesystem:${DB_MIGRATIONS_DIR:../db}/migration,filesystem:${DB_MIGRATIONS_DIR:../db}/seed

logging:
  level:
    com.umfl: DEBUG
