spring:
  application:
    name: um-fantasy-league
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/umfl}
    username: ${DB_USER:umfl}
    password: ${DB_PASSWORD:umfl}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# There are no `umfl.*` tunables. Scoring weights are reference data in
# `scoring_coefficient`, and the roster budget is `tournament.credit_grant` --
# both are retuned with an UPDATE, not a redeploy.

# `rate-limit.*` is operational tuning for RateLimitFilter -- how hard a
# deployed instance throttles per client IP -- not domain data, so it's not
# one of the `umfl.*` tunables disclaimed above.
rate-limit:
  api:
    capacity: 300
    refill-period: PT1M

# `scraper.*` is the address of the Tabletop League scraper sidecar
# (tools/tabletopleague-scraper) that the admin match import calls. Same
# category as `rate-limit` above and as DB_URL: deployment topology, not domain
# data -- the application cannot read a hostname out of a database it hasn't
# reached yet. The default is a bare `npm run serve` on the same host, so a dev
# session needs no configuration; compose points it at the `scraper` service.
scraper:
  base-url: ${SCRAPER_BASE_URL:http://localhost:3000}

logging:
  level:
    com.umfl: INFO
