spring:
  application:
    name: um-fantasy-league
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/umfl}
    username: ${DB_USER:umfl}
    password: ${DB_PASSWORD:umfl}
  flyway:
    enabled: true
    # `db/` lives at the **repository root**, not on the classpath: the Rust
    # port in `backend-rs/` migrates the same directory, so the SQL is shared
    # rather than copied into one build's resources. Flyway therefore reads it
    # off the filesystem, and a `filesystem:` location is relative to the
    # working directory -- which Gradle sets to `backend/` for both
    # `:backend:test` and `:backend:bootRun`, hence the `../` default.
    #
    # `DB_MIGRATIONS_DIR` is the escape hatch for every other launcher, where
    # that relative guess is wrong: a bare `java -jar` from the repository root
    # (`DB_MIGRATIONS_DIR=db`), or the container image, which has to COPY `db`
    # in and point at it absolutely. It is the same category as `DB_URL` -- a
    # path this process cannot read out of a database it hasn't reached yet --
    # and not one of the `umfl.*` domain tunables disclaimed below.
    locations: filesystem:${DB_MIGRATIONS_DIR:../db}/migration
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# There are no `umfl.*` tunables. Scoring weights are reference data in
# `scoring_coefficient`, and the roster budget is `tournament.credit_grant` --
# both are retuned with an UPDATE, not a redeploy.

# `rate-limit.*` is operational tuning for RateLimitFilter -- how hard a
# deployed instance throttles per client IP -- not domain data, so it's not
# one of the `umfl.*` tunables disclaimed above.
rate-limit:
  api:
    capacity: 300
    refill-period: PT1M

# `scraper.*` is the address of the Tabletop League scraper sidecar
# (tools/tabletopleague-scraper) that the admin match import calls. Same
# category as `rate-limit` above and as DB_URL: deployment topology, not domain
# data -- the application cannot read a hostname out of a database it hasn't
# reached yet. The default is a bare `npm run serve` on the same host, so a dev
# session needs no configuration; compose points it at the `scraper` service.
scraper:
  base-url: ${SCRAPER_BASE_URL:http://localhost:3000}

logging:
  level:
    com.umfl: INFO
