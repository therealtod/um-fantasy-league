spring:
  flyway:
    enabled: true
    # Every integration test asserts against the demo fixtures (seeded
    # tournaments, managers, recorded matches) -- see V3__demo_fixtures.sql.
    # Heroes and boards are not in there: they are reference data and come from
    # `db/migration/V2__reference_data.sql`, in every profile.
    locations: filesystem:${DB_MIGRATIONS_DIR:../db}/migration,filesystem:${DB_MIGRATIONS_DIR:../db}/seed

logging:
  level:
    com.umfl: INFO
    org.testcontainers: WARN
