# Docker's default `json-file` driver keeps every line either container has
# ever written, forever, and nothing on this box prunes it -- so on a free-tier
# VPS the logs grow until the boot volume is full and *both* services fail for
# a reason that looks nothing like a log problem. 10m x 3 caps each service at
# 30 MB.
#
# An anchor rather than two copies: a cap that drifts between the services is a
# cap someone has to re-derive to trust.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ghcr.io/therealtod/umfl-backend:latest
    container_name: umfl-backend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    stop_grace_period: 35s
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SCRAPER_BASE_URL: http://scraper:3000
    # Not published to the host: only `cloudflared` (over the compose
    # network) and anything SSHed in reach it now that the tunnel runs in
    # this file too. Publishing :8080 would give the internet a second,
    # un-tunneled way onto a box that otherwise has no public listener.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # Headless-browser sidecar for the admin match import. tabletopleague.com
  # renders its match pages client-side, so reading one needs a real browser --
  # which is why this is a separate Ubuntu-based Playwright image rather than
  # something added to the Alpine JRE backend image.
  #
  # Deliberately not published to the host: only `backend` reaches it, over the
  # compose network. `mem_limit` is its own budget, not shared with the
  # backend's -- Chromium needs room to render a page, and the whole point of
  # capping it is that a heavy page can't take the API down with it.
  #
  # The backend does not depend_on this: a scraper that is down or restarting
  # must not hold up the API, and the import endpoint already answers 503 with
  # a message naming the problem.
  scraper:
    image: ghcr.io/therealtod/umfl-scraper:latest
    container_name: umfl-scraper
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 640m
    environment:
      SCRAPER_HOST: 0.0.0.0
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Publishes `backend` to the internet as api.umfantasyleague.com. A named
  # tunnel, not the ad-hoc `cloudflared tunnel --url ...` quick tunnel this
  # replaces: it authenticates with a long-lived token instead of minting a
  # random trycloudflare.com hostname that rotates on every restart, so the
  # public hostname is now stable across reboots and deploys -- which is what
  # let BACKEND_HOST in frontend/wrangler.toml move from a dashboard-only
  # Worker variable into a committed [vars] entry (see AGENTS.md's CI/CD
  # section).
  #
  # The public hostname -> `http://backend:8080` mapping lives on the
  # Cloudflare side (Zero Trust dashboard: Networks -> Tunnels -> the
  # umfl-backend tunnel -> Public Hostname), not here -- this container only
  # needs the token to dial home. CLOUDFLARE_TUNNEL_TOKEN comes from that
  # same tunnel's "Install connector" step and lives in .env like every other
  # secret on this box, never in the repo.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: umfl-tunnel
    restart: unless-stopped
    logging: *default-logging
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
