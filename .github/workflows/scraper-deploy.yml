# Builds and publishes the tabletopleague-scraper sidecar image on its own,
# decoupled from backend-deploy.yml's build-and-push job so this can run
# without also triggering that workflow's `deploy` job (an unconditional SSH
# redeploy to the production VPS). Deliberately does not SSH-deploy anywhere
# itself, mirroring backend-rs-deploy.yml's shape.
#
# tools/tabletopleague-scraper has no test script (AGENTS.md: "not part of
# the Gradle/npm build") and no CI gate of its own, so there's no `test` job
# to run first here -- backend-ci.yml/backend-rs-ci.yml exercise the two
# backends that call it, not the scraper itself.
name: scraper-deploy

on:
  # Manual re-publish. The path filter below means an unrelated commit to
  # master ships nothing, so publishing with no source change (e.g. after a
  # cancelled or failed run) needs a way to run the pipeline on demand.
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "tools/tabletopleague-scraper/**"
      - ".github/workflows/scraper-deploy.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/umfl-scraper

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the scraper image
        uses: docker/build-push-action@v6
        with:
          context: ./tools/tabletopleague-scraper
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=scraper
          cache-to: type=gha,mode=max,scope=scraper
