# Builds and publishes the Rust backend image. Deliberately does not
# SSH-deploy anywhere on its own -- add that job once a box is a permanent
# fixture, mirroring backend-deploy.yml's `deploy` job.
name: backend-rs-deploy

on:
  # Manual re-deploy / first-image build. The path filter below means an
  # unrelated commit to master ships nothing, so building against a freshly
  # provisioned box (or re-publishing with no source change) needs a way to
  # run the pipeline without touching backend-rs sources.
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "backend-rs/**"
      - "db/**"
      - ".github/workflows/backend-rs-deploy.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/umfl-backend-rs

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rs
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs

      - name: Run backend-rs test suite
        run: cargo test --workspace

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Rust backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend-rs/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
