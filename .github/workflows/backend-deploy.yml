name: backend-deploy

on:
  # Manual re-deploy. The path filter below means an unrelated commit to master
  # ships nothing, so a VPS rebuild (or a first deploy against a freshly
  # provisioned box) needs a way to run the pipeline without touching backend
  # sources.
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "Dockerfile"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "tools/tabletopleague-scraper/**"
      - ".github/workflows/backend-deploy.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/umfl-backend
  SCRAPER_IMAGE: ghcr.io/${{ github.repository_owner }}/umfl-scraper

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run backend test suite
        run: ./gradlew :backend:test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The headless-browser sidecar the admin match import calls. Built here
      # rather than in its own workflow so `docker compose pull` on the VPS
      # always finds the two images in step -- they are deployed together and
      # share the compose file, even though only this one carries a browser.
      - name: Build and push the scraper image
        uses: docker/build-push-action@v6
        with:
          context: ./tools/tabletopleague-scraper
          push: true
          tags: |
            ${{ env.SCRAPER_IMAGE }}:${{ github.sha }}
            ${{ env.SCRAPER_IMAGE }}:latest
          cache-from: type=gha,scope=scraper
          cache-to: type=gha,mode=max,scope=scraper

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/umfl
            docker compose pull backend scraper
            docker compose up -d backend scraper
            docker image prune -f
