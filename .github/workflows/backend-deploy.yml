# Builds and publishes the backend image, plus the migrator image that
# applies db/migration ahead of it (see db/Dockerfile), and deploys both to
# the VPS. This file used to be backend-rs-deploy.yml; it dropped the `-rs`
# suffix once it became the only backend deploy pipeline this repo has. The
# published image itself keeps the `umfl-backend-rs` name, since
# `deploy/docker-compose.prod.yml` and the VPS already pull it under that tag.
name: backend-deploy

on:
  # Manual re-deploy / first-image build. The path filter below means an
  # unrelated commit to master ships nothing, so building against a freshly
  # provisioned box (or re-publishing with no source change) needs a way to
  # run the pipeline without touching backend-rs sources.
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "backend-rs/**"
      - "db/**"
      - ".github/workflows/backend-deploy.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/umfl-backend-rs
  MIGRATOR_IMAGE: ghcr.io/${{ github.repository_owner }}/umfl-migrator

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rs
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs

      - name: Run backend-rs test suite
        run: cargo test --workspace

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Rust backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend-rs/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Built here rather than its own workflow so `docker compose pull` on
      # the VPS always finds both images in step -- they deploy together
      # below.
      - name: Build and push the migrator image
        uses: docker/build-push-action@v6
        with:
          context: ./db
          file: ./db/Dockerfile
          push: true
          tags: |
            ${{ env.MIGRATOR_IMAGE }}:${{ github.sha }}
            ${{ env.MIGRATOR_IMAGE }}:latest
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/umfl
            # `-f` is load-bearing, not stylistic: bare `docker compose` only
            # auto-discovers a file literally named `compose.yaml`/`compose.yml`/
            # `docker-compose.yaml`/`docker-compose.yml` -- never
            # `docker-compose.prod.yml`. Omitting it risks silently targeting
            # a stale same-directory `docker-compose.yml` instead (which is
            # exactly what happened once already on this box).
            docker compose -f docker-compose.prod.yml pull backend flyway
            # `flyway` before `backend`: compose's own `depends_on:
            # condition: service_completed_successfully` already orders
            # them, but naming it first here means a freshly pulled image
            # is what actually runs the migration, not whatever happened to
            # be sitting there from a previous deploy.
            docker compose -f docker-compose.prod.yml up -d flyway backend
            docker image prune -f
