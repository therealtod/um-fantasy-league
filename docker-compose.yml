services:
  db:
    image: postgres:17-alpine
    container_name: umfl-db
    environment:
      POSTGRES_DB: umfl
      POSTGRES_USER: umfl
      POSTGRES_PASSWORD: umfl
    ports:
      - "5433:5432"
    volumes:
      - umfl-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umfl -d umfl"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies db/migration and, since this stack is dev-shaped, db/seed too --
  # see AGENTS.md on why which locations a Flyway run applies is decided by
  # the invocation, not by the backend's own profile. The Rust backend below
  # doesn't carry a migration runner of its own (see db/Dockerfile), so this
  # one-shot container is what makes a bare `docker compose up` produce a
  # migrated, seeded database.
  flyway:
    build:
      context: db
      dockerfile: Dockerfile
    container_name: umfl-flyway
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/umfl
      FLYWAY_USER: umfl
      FLYWAY_PASSWORD: umfl
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/migration,filesystem:/flyway/sql/seed
      FLYWAY_CONNECT_RETRIES: "10"

  backend:
    build:
      context: .
      dockerfile: backend-rs/Dockerfile
    container_name: umfl-backend
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/umfl
      DB_USER: umfl
      DB_PASSWORD: umfl
      SCRAPER_BASE_URL: http://scraper:3000
    ports:
      - "8080:8080"

  # Renders tabletopleague.com match pages so the admin match import can read
  # them -- those pages are client-side React, so a plain HTTP fetch from the
  # backend returns the JS bundle and no data. Optional: the backend starts and
  # runs fine without it, and only the import endpoint fails (503) when it's
  # down. Not published to the host -- only `backend` talks to it.
  scraper:
    build: ./tools/tabletopleague-scraper
    container_name: umfl-scraper
    environment:
      SCRAPER_HOST: 0.0.0.0
    expose:
      - "3000"

volumes:
  umfl-pgdata:
